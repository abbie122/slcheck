name: Update SL data

# BAG publishes the new Spezialitaetenliste on the 1st of each month.
# This checks on the 2nd, 5th and 10th (in case BAG is late) and updates
# index.html only if the data actually changed.
on:
  schedule:
    - cron: "0 6 2,5,10 * *"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and convert BAG data
        run: python3 scripts/update_sl.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name  "slcheck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Monthly SL data update ($(date +'%d %b %Y'))"
          git push
          # make sure GitHub Pages rebuilds the live site
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
